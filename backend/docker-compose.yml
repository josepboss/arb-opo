version: "3.9"

services:
  # ─── FlareSolverr - Cloudflare bypass proxy ────────────────────────────────
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    ports:
      - "8191:8191"
    environment:
      - LOG_LEVEL=info
      - LOG_HTML=false
      - CAPTCHA_SOLVER=none
      - TZ=UTC
    restart: unless-stopped
    # Pass proxy env vars through to FlareSolverr if configured
    # Uncomment and set PROXY_LIST if you want FlareSolverr itself to use proxies:
    # - BROWSER_PROXY=
    networks:
      - arbitrage-net

  # ─── Arbitrage Engine ──────────────────────────────────────────────────────
  arbitrage-engine:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: arbitrage-engine
    ports:
      - "2105:2105"
    depends_on:
      - flaresolverr
    environment:
      # Dashboard
      - ARBITRAGE_HOST=0.0.0.0
      - ARBITRAGE_PORT=2105
      - ARBITRAGE_DB_PATH=/app/data/arbitrage.db

      # Schedule
      - SCRAPE_INTERVAL_MINUTES=30

      # FlareSolverr (Docker service name resolves to container IP)
      - FLARESOLVERR_URL=http://flaresolverr:8191
      - FLARESOLVERR_TIMEOUT=30
      - FLARESOLVERR_MAX_RETRIES=3

      # Proxy pool (comma-separated, optional)
      # Format: http://user:pass@host:port
      # If empty, FlareSolverr uses its own IP
      - PROXY_LIST=
      - PROXY_BLACKLIST_THRESHOLD=3

      # Proxy Refresher (gfpcom/free-proxy-list)
            - PROXY_SOURCE_URLS=https://raw.githubusercontent.com/gfpcom/free-proxy-list/main/proxies.txt,https://raw.githubusercontent.com/gfpcom/free-proxy-list/main/proxy-list-http.txt
            - PROXY_REFRESH_INTERVAL=15
            - MAX_VERIFIED_PROXIES=30
            - PROXY_TEST_TIMEOUT=10
            - PROXY_TEST_WORKERS=20
            - VERIFIED_PROXIES_PATH=/app/data/verified_proxies.json
      
            # Selenium
            - HEADLESS=true
            - TZ=UTC
    volumes:
      - arbitrage_data:/app/data
    restart: unless-stopped
    cap_add:
      - SYS_ADMIN
    security_opt:
      - seccomp:unconfined
    networks:
      - arbitrage-net

networks:
  arbitrage-net:
    driver: bridge

volumes:
  arbitrage_data: